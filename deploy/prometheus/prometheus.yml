global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics Jupiter's processes send to the collector over OTLP.
  - job_name: jupiter
    static_configs:
      - targets: ["otel-collector:8889"]
  # The collector's own health: dropped spans, queue sizes, exporter errors.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
