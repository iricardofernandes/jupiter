name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The runner is thrown away after each job, and postgrestest stops the containers it
# starts, so testcontainers' reaper adds nothing here. Started by every test package at
# once, it can take longer than its one-minute wait.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  lint:
    name: format, vet, lint, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make generate-check
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: make vuln

  test:
    name: unit, property and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  property:
    name: property tests (1000 cases each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-property RAPID_CHECKS=1000

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  # The simulations run a fixed budget of seeds on every push, so a push that passes is
  # reproducible; the nightly workflow runs random ones.
  simulation-cards:
    name: simulation, cards (seeds 1-2, 10,000 payments each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-simulation SIM_RUN='TestSimulation' SIM_SEEDS=1-2 SIM_PAYMENTS=10000

  simulation-rails:
    name: simulation, every rail (seeds 1-3, 500 scenarios each) and regression seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-simulation SIM_RUN='TestRailsSimulation|TestRegressionSeeds' SIM_SEEDS=1-3 SIM_RAIL_SCENARIOS=500

  e2e:
    name: golden path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-e2e

  compose:
    name: local infrastructure starts healthy from cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make up
      - if: failure()
        run: docker compose ps && docker compose logs
      - if: always()
        run: make clean
