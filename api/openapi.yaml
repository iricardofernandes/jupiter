openapi: 3.0.3
info:
  title: Jupiter API
  version: "2026-09-30"
  description: |
    Jupiter's merchant API. Every response describes the version it was rendered in with
    the Jupiter-Version header; this document describes the current version.

    Authenticate with a secret or restricted key as a bearer token. Keys prefixed
    `_test_` act on test-mode data and `_live_` on live-mode data; the two never mix.

    Every POST accepts an Idempotency-Key header. A retry with the same key and the same
    body returns the first response without acting again; the same key with a different
    body is refused.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: Payment methods
  - name: Payment intents
  - name: Refunds
  - name: Payouts
  - name: Subscriptions
  - name: Receivables
  - name: Recipients
  - name: Anticipations
  - name: Disputes
  - name: Reconciliation
  - name: Risk
  - name: Test helpers
  - name: API keys
  - name: Webhook endpoints
  - name: Events

paths:
  /v1/payment_methods:
    post:
      operationId: createPaymentMethod
      tags: [Payment methods]
      description: |
        Saves a card, from its number or from a token the vault issued to a web page.

        A number sent here passes through Jupiter's API on its way to the vault, which
        puts the merchant's server in PCI DSS scope. A token keeps it out: the page sends
        the card to the vault's tokenization route with the publishable key, and the
        server sends only the token here. Tokens must be claimed within an hour, with a
        secret key of the same merchant and mode as the publishable key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentMethodRequest" }
      responses:
        "200":
          description: The payment method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_methods/{id}:
    get:
      operationId: getPaymentMethod
      tags: [Payment methods]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The payment method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_intents:
    get:
      operationId: listPaymentIntents
      tags: [Payment intents]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of payment intents, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntentList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createPaymentIntent
      tags: [Payment intents]
      description: |
        Creates a payment intent, and confirms it at once when confirm is true. A card that
        declines answers 402 with the intent, now back in requires_payment_method.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentIntentRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_intents/{id}:
    get:
      operationId: getPaymentIntent
      tags: [Payment intents]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: updatePaymentIntent
      tags: [Payment intents]
      description: Changes a payment intent before it is confirmed.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentIntentRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_intents/{id}/confirm:
    post:
      operationId: confirmPaymentIntent
      tags: [Payment intents]
      description: |
        Tries to pay. The intent ends in requires_capture (manual capture), succeeded
        (automatic), requires_action, or back in requires_payment_method with a 402 when
        the card declines. When the rail's answer is lost, it stays in processing until
        Jupiter learns the outcome, and a webhook reports it.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPaymentIntentRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_intents/{id}/capture:
    post:
      operationId: capturePaymentIntent
      tags: [Payment intents]
      description: Captures all or part of an authorization; the rest is released.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapturePaymentIntentRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payment_intents/{id}/cancel:
    post:
      operationId: cancelPaymentIntent
      tags: [Payment intents]
      description: Cancels a payment intent, voiding its authorization if it has one.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPaymentIntentRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/refunds:
    get:
      operationId: listRefunds
      tags: [Refunds]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: payment_intent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of refunds, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createRefund
      tags: [Refunds]
      description: Refunds all or part of a succeeded payment intent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRefundRequest" }
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/refunds/{id}:
    get:
      operationId: getRefund
      tags: [Refunds]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payouts:
    get:
      operationId: listPayouts
      tags: [Payouts]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of payouts, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createPayout
      tags: [Payouts]
      description: |
        Sends part of your balance to a Pix key. The amount is held at once; the payout is
        pending until the bank confirms the transfer, then paid, or failed with the amount
        back in your balance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayoutRequest" }
      responses:
        "200":
          description: The payout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/payouts/{id}:
    get:
      operationId: getPayout
      tags: [Payouts]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The payout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of subscriptions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createSubscription
      tags: [Subscriptions]
      description: |
        Charges a customer every interval by Pix Automático. The subscription is incomplete
        until the customer authorizes it: by reading next_action.pix_display_qr_code.data
        (authorization method qr_code), or by accepting the request their bank shows them
        (payer_request). Each cycle then becomes a payment intent, which the customer's bank
        debits on its due date.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubscriptionRequest" }
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [Subscriptions]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      tags: [Subscriptions]
      description: |
        Cancels the customer's authorization. Charges not yet due to be debited are canceled
        with it; one due today or later in its retries goes on.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/receivables/agenda:
    get:
      operationId: getReceivablesAgenda
      tags: [Receivables]
      description: |
        The merchant's card receivables with a settlement date from `from` to `to` (up to 400
        days): one unit per arrangement and date, net of fees and refunds, with what is
        committed to financiers' contracts at the registry and what is free. With as_of,
        the agenda as it stood then.
      parameters:
        - { name: recipient, in: query, description: "Whose agenda; the merchant's own when omitted.", schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: as_of
          in: query
          description: A Unix timestamp; the agenda as it stood then. Now if omitted.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The agenda, earliest settlement first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablesAgenda" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/receivables/opt_ins:
    get:
      operationId: listReceivablesOptIns
      tags: [Receivables]
      responses:
        "200":
          description: The financiers the merchant authorized to see its agenda, and those it revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablesOptInList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createReceivablesOptIn
      tags: [Receivables]
      description: Authorizes a financier, by its CNPJ, to see the merchant's agenda at the registry.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReceivablesOptInRequest" }
      responses:
        "200":
          description: The opt-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablesOptIn" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/receivables/opt_ins/{financier}/revoke:
    post:
      operationId: revokeReceivablesOptIn
      tags: [Receivables]
      parameters:
        - { name: financier, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The opt-in, no longer active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablesOptIn" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/recipients:
    get:
      operationId: listRecipients
      tags: [Recipients]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of recipients, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createRecipient
      tags: [Recipients]
      description: A seller a marketplace splits its payments to, pending verification.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecipientRequest" }
      responses:
        "200":
          description: The recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/recipients/{id}:
    get:
      operationId: getRecipient
      tags: [Recipients]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: updateRecipient
      tags: [Recipients]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRecipientRequest" }
      responses:
        "200":
          description: The recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/recipients/{id}/balance:
    get:
      operationId: getRecipientBalance
      tags: [Recipients]
      description: "The recipient's balance: pending, by when it becomes available, available and reserved."
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientBalance" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/anticipations/simulate:
    post:
      operationId: simulateAnticipation
      tags: [Anticipations]
      description: |
        Prices anticipating a verified recipient's units: their present value at Jupiter's
        monthly rate, for what of each the registry holds free. The quote holds for ten
        minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateAnticipationRequest" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnticipationQuote" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/anticipations:
    post:
      operationId: createAnticipation
      tags: [Anticipations]
      description: |
        Carries out a quote: Jupiter buys the units, registered at the registry as an
        ownership transfer in its favour, and the price is available to the recipient.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAnticipationRequest" }
      responses:
        "200":
          description: The anticipation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anticipation" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/anticipations/{id}:
    get:
      operationId: getAnticipation
      tags: [Anticipations]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The anticipation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anticipation" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/test_helpers/recipients/{id}/verify:
    post:
      operationId: verifyRecipient
      tags: [Test helpers]
      description: Test mode only. Ends a recipient's verification, verified or rejected.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRecipientRequest" }
      responses:
        "200":
          description: The recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipient" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/disputes:
    get:
      operationId: listDisputes
      tags: [Disputes]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: payment_intent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of disputes, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeList" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/disputes/{id}:
    get:
      operationId: getDispute
      tags: [Disputes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The dispute, with its history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: updateDispute
      tags: [Disputes]
      description: |
        Saves evidence on a dispute that needs a response, and submits it when submit is
        true: Jupiter represents a chargeback to the network, escalates a pre-arbitration
        to arbitration, or puts a MED claim to an operator. A MED claim lost to a return
        can be contested the same way, within the window the Banco Central sets. Evidence
        saved and not submitted is submitted for a card dispute when its due_by passes.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDisputeRequest" }
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/disputes/{id}/close:
    post:
      operationId: closeDispute
      tags: [Disputes]
      description: |
        Accepts a dispute that needs a response. A card dispute is lost at once; for a MED
        claim, the bank returns the amount held to the payer, and the dispute is lost when
        it has.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/fraud_reports:
    get:
      operationId: listFraudReports
      tags: [Disputes]
      description: Issuers' reports that card payments were fraud. They dispute nothing and move no money, but count in the dispute ratio.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of fraud reports, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudReportList" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/dispute_monitoring:
    get:
      operationId: getDisputeMonitoring
      tags: [Disputes]
      description: |
        The month's dispute ratio, in the style of Visa's acquirer monitoring program: card
        disputes opened and fraud reports received over card payments, in basis points,
        and whether it is excessive.
      parameters:
        - name: month
          in: query
          description: YYYY-MM; this month when omitted.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: The month's ratio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeMonitoring" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/test_helpers/disputes:
    post:
      operationId: createTestDispute
      tags: [Test helpers]
      description: |
        Test mode only. Has the test network open a chargeback on a card payment, as an
        issuer would. Evidence containing winning_evidence wins; losing_evidence goes to
        pre-arbitration; anything else is won when the issuer's time runs out.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTestDisputeRequest" }
      responses:
        "200":
          description: The dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/test_helpers/fraud_reports:
    post:
      operationId: createTestFraudReport
      tags: [Test helpers]
      description: Test mode only. Reports a card payment as fraud, as an issuer would.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTestFraudReportRequest" }
      responses:
        "200":
          description: The fraud report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudReport" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/reconciliation/reports/{date}:
    get:
      operationId: getReconciliationReport
      tags: [Reconciliation]
      description: |
        A day's reconciliation of your payments with every counterparty: per counterparty and
        stream, how many of your movements of the day matched what the counterparty
        reported, and the breaks still open at the day's end, by age.
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: The day's report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationReport" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/reconciliation/breaks:
    get:
      operationId: listReconciliationBreaks
      tags: [Reconciliation]
      description: What did not match on your movements, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved] }
      responses:
        "200":
          description: A page of breaks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationBreakList" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/decisions:
    get:
      operationId: listRiskDecisions
      tags: [Risk]
      description: The decision log, newest first. Every decision lists the rules that fired and the features they saw.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: action
          in: query
          schema: { type: string, enum: [allow, review, request_3ds, block] }
        - name: payment_intent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskDecisionList" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/decisions/{id}:
    get:
      operationId: getRiskDecision
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskDecision" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/rules:
    get:
      operationId: listRiskRules
      tags: [Risk]
      description: The merchant's own rules, and the platform's, which apply to every payment.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRulePage" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createRiskRule
      tags: [Risk]
      description: |
        Adds a rule: when expression holds for a payment, action applies. Expressions use
        the features a decision records, such as `amount >= 500000 && brand == "elo"` or
        `ip_attempts_1h > 3`; docs/api/risk.md lists them.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRiskRuleRequest" }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRule" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/rules/{id}:
    delete:
      operationId: deleteRiskRule
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The deleted rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedObject" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/list_items:
    get:
      operationId: listRiskListItems
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of the allow and block list entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskListItemPage" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createRiskListItem
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRiskListItemRequest" }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskListItem" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/risk/list_items/{id}:
    delete:
      operationId: deleteRiskListItem
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The deleted entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedObject" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/test_helpers/payment_intents/{id}/complete_action:
    post:
      operationId: completePaymentIntentAction
      tags: [Test helpers]
      description: |
        Test mode only. Plays the cardholder's part in a requires_action intent: succeeded
        resumes the authorization, failed returns the intent to requires_payment_method.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteActionRequest" }
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Failure" }

  /v1/api_keys:
    get:
      operationId: listApiKeys
      tags: [API keys]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of keys, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createApiKey
      tags: [API keys]
      description: Creates a restricted key. Its value is returned only in this response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "200":
          description: The new key, with its value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/api_keys/{id}:
    get:
      operationId: getApiKey
      tags: [API keys]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/api_keys/{id}/revoke:
    post:
      operationId: revokeApiKey
      tags: [API keys]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Failure" }

  /v1/webhook_endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhook endpoints]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of endpoints, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointList" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: createWebhookEndpoint
      tags: [Webhook endpoints]
      description: Creates an endpoint. Its signing secret is returned only in this response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
      responses:
        "200":
          description: The new endpoint, with its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/webhook_endpoints/{id}:
    get:
      operationId: getWebhookEndpoint
      tags: [Webhook endpoints]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Failure" }
    post:
      operationId: updateWebhookEndpoint
      tags: [Webhook endpoints]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookEndpointRequest" }
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Failure" }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhook endpoints]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The endpoint was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedObject" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/webhook_endpoints/{id}/roll_secret:
    post:
      operationId: rollWebhookEndpointSecret
      tags: [Webhook endpoints]
      description: |
        Issues a new signing secret. Current secrets keep signing beside it for
        expire_current_in seconds (default 86400, at most 604800), so receivers can switch
        without missing a delivery.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollSecretRequest" }
      responses:
        "200":
          description: The endpoint, with its new secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Failure" }

  /v1/events:
    get:
      operationId: listEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: A page of events, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/events/{id}:
    get:
      operationId: getEvent
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        default: { $ref: "#/components/responses/Failure" }
  /v1/events/{id}/resend:
    post:
      operationId: resendEvent
      tags: [Events]
      description: Delivers the event again, to one endpoint or to every endpoint subscribed to its type.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendEventRequest" }
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        default: { $ref: "#/components/responses/Failure" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    StartingAfter:
      name: starting_after
      in: query
      description: An object id; the page starts with the next older object.
      schema: { type: string }
    EndingBefore:
      name: ending_before
      in: query
      description: An object id; the page ends with the next newer object.
      schema: { type: string }
    Include:
      name: include[]
      in: query
      description: Related objects to return inline. Events accept related_object.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 255 }

  responses:
    Failure:
      description: The request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [type, code, message, request_id, doc_url]
      properties:
        type:
          type: string
          enum: [api_error, authentication_error, card_error, permission_error, invalid_request_error, idempotency_error, rate_limit_error]
        code: { type: string }
        decline_code: { type: string }
        payment_intent: { $ref: "#/components/schemas/PaymentIntent" }
        message: { type: string }
        param: { type: string }
        request_id: { type: string }
        doc_url: { type: string }

    ListMeta:
      type: object
      required: [object, has_more, url]
      properties:
        object: { type: string, enum: [list] }
        has_more: { type: boolean }
        url: { type: string }

    PaymentMethod:
      type: object
      required: [id, object, livemode, type, card, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [payment_method] }
        livemode: { type: boolean }
        type: { type: string, enum: [card] }
        card: { $ref: "#/components/schemas/PaymentMethodCard" }
        created: { type: integer, format: int64 }
    PaymentMethodCard:
      type: object
      required: [brand, bin, last4, exp_month, exp_year, fingerprint]
      properties:
        brand: { type: string, enum: [visa, mastercard, amex, elo, hipercard, unknown] }
        bin:
          type: string
          description: The first eight digits of a number of sixteen or more, else the first six.
        last4: { type: string }
        exp_month: { type: integer }
        exp_year: { type: integer }
        fingerprint:
          type: string
          description: The same for the same card number across this merchant's payment methods.
    CreatePaymentMethodRequest:
      type: object
      required: [type, card]
      additionalProperties: false
      properties:
        type: { type: string, enum: [card] }
        card: { $ref: "#/components/schemas/CardDetails" }
    CardDetails:
      type: object
      description: Either number and expiry, with an optional cvc, or a token from the vault.
      additionalProperties: false
      properties:
        number: { type: string }
        exp_month: { type: integer }
        exp_year: { type: integer }
        cvc: { type: string }
        token: { type: string }

    PaymentIntent:
      type: object
      required: [id, object, livemode, amount, currency, capture_method, status, payment_method, description,
                 amount_capturable, amount_received, amount_refunded, latest_attempt, last_payment_error,
                 next_action, cancellation_reason, installments, setup_future_usage, request_three_d_secure,
                 risk_decision, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [payment_intent] }
        livemode: { type: boolean }
        amount: { type: integer, format: int64, description: "In the currency's minor unit, such as centavos." }
        currency: { type: string, description: "Lower-case ISO 4217 code." }
        capture_method: { type: string, enum: [automatic, manual] }
        status:
          type: string
          enum: [requires_payment_method, requires_confirmation, requires_action, processing, requires_capture, succeeded, canceled]
        payment_method: { type: string, nullable: true }
        description: { type: string }
        amount_capturable: { type: integer, format: int64 }
        amount_received: { type: integer, format: int64 }
        amount_refunded: { type: integer, format: int64 }
        latest_attempt: { type: string, nullable: true }
        last_payment_error:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PaymentError" }]
        next_action:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NextAction" }]
        cancellation_reason: { type: string, nullable: true }
        installments:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Installments" }]
        setup_future_usage: { type: string, enum: [off_session], nullable: true }
        request_three_d_secure: { type: string, enum: [automatic, any] }
        risk_decision:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RiskDecisionRef" }]
        pix:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PixOptions" }]
        subscription: { type: string, nullable: true, description: "The subscription a pix_automatico payment charges." }
        split:
          type: array
          items: { $ref: "#/components/schemas/SplitRule" }
        boleto:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BoletoOptions" }]
        created: { type: integer, format: int64 }
    SplitRule:
      type: object
      additionalProperties: false
      required: [recipient]
      description: |
        A recipient's share of a card payment: a fixed amount, or a percentage with two
        decimals; every rule of a split is the same kind, and they add up to the whole.
        Exactly one rule is liable for chargebacks and exactly one takes the centavos
        rounding leaves over. The rules with charge_fee pay Jupiter's fee, in proportion
        to their shares, and hold at least 10% of the payment between them.
      properties:
        recipient: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        percentage: { type: string, pattern: '^\d{1,3}\.\d{2}$' }
        liable: { type: boolean }
        remainder: { type: boolean }
        charge_fee: { type: boolean }
    Recipient:
      type: object
      required: [id, object, livemode, name, tax_id, default, status, payout_destination, transfer_settings, automatic_anticipation, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [recipient] }
        livemode: { type: boolean }
        name: { type: string }
        tax_id: { type: string, description: "The recipient's CPF or CNPJ, which its receivables are registered under." }
        default: { type: boolean, description: "Whether this is the merchant's own recipient." }
        status: { type: string, enum: [pending, verified, rejected], description: "Its verification (KYC or KYB). Only a verified recipient is paid out or anticipates." }
        payout_destination:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RecipientDestination" }]
        transfer_settings: { $ref: "#/components/schemas/TransferSettings" }
        automatic_anticipation: { $ref: "#/components/schemas/AutomaticAnticipation" }
        created: { type: integer, format: int64 }
    RecipientDestination:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [pix, bank_account] }
        pix_key: { type: string, maxLength: 77 }
        ispb: { type: string }
        branch: { type: string }
        account: { type: string }
    TransferSettings:
      type: object
      additionalProperties: false
      required: [interval]
      properties:
        interval: { type: string, enum: [manual, daily, weekly, monthly] }
        day: { type: integer, description: "1 (Monday) to 5 for weekly transfers, 1 to 28 for monthly ones." }
    AutomaticAnticipation:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        delay_days: { type: integer, minimum: 1, maximum: 30, description: "How old a unit is before it is anticipated." }
    RecipientList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Recipient" }
    CreateRecipientRequest:
      type: object
      additionalProperties: false
      required: [name, tax_id]
      properties:
        name: { type: string, maxLength: 200 }
        tax_id: { type: string }
        payout_destination: { $ref: "#/components/schemas/RecipientDestination" }
        transfer_settings: { $ref: "#/components/schemas/TransferSettings" }
        automatic_anticipation: { $ref: "#/components/schemas/AutomaticAnticipation" }
    UpdateRecipientRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        payout_destination: { $ref: "#/components/schemas/RecipientDestination" }
        transfer_settings: { $ref: "#/components/schemas/TransferSettings" }
        automatic_anticipation: { $ref: "#/components/schemas/AutomaticAnticipation" }
    VerifyRecipientRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [verified, rejected] }
    RecipientBalance:
      type: object
      required: [object, recipient, currency, pending, available, reserved, pending_on]
      properties:
        object: { type: string, enum: [recipient_balance] }
        recipient: { type: string }
        currency: { type: string }
        pending: { type: integer, format: int64, description: "What its unsettled receivables hold, net of fees and of what Jupiter bought." }
        available: { type: integer, format: int64, description: "What can be paid out now, less payouts in flight." }
        reserved: { type: integer, format: int64 }
        pending_on:
          type: array
          description: The pending balance by the day it becomes available.
          items:
            type: object
            required: [available_on, amount]
            properties:
              available_on: { type: string, format: date }
              amount: { type: integer, format: int64 }
    AnticipationUnit:
      type: object
      required: [unit, settlement_date, amount, price, days]
      properties:
        unit: { type: string }
        settlement_date: { type: string, format: date }
        amount: { type: integer, format: int64 }
        price: { type: integer, format: int64 }
        days: { type: integer }
    AnticipationQuote:
      type: object
      required: [id, object, recipient, currency, monthly_rate, units, amount, price, fee, expires_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [anticipation_quote] }
        recipient: { type: string }
        currency: { type: string }
        monthly_rate: { type: string }
        units:
          type: array
          items: { $ref: "#/components/schemas/AnticipationUnit" }
        amount: { type: integer, format: int64, description: What of the units Jupiter buys. }
        price: { type: integer, format: int64, description: What the recipient receives now. }
        fee: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
    Anticipation:
      type: object
      required: [id, object, livemode, recipient, currency, monthly_rate, units, amount, price, fee, automatic, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [anticipation] }
        livemode: { type: boolean }
        recipient: { type: string }
        currency: { type: string }
        monthly_rate: { type: string }
        units:
          type: array
          items: { $ref: "#/components/schemas/AnticipationUnit" }
        amount: { type: integer, format: int64 }
        price: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        automatic: { type: boolean }
        created: { type: integer, format: int64 }
    SimulateAnticipationRequest:
      type: object
      additionalProperties: false
      properties:
        recipient: { type: string, description: "The merchant's own when omitted." }
        units:
          type: array
          maxItems: 400
          description: The units to anticipate; all that can be when omitted.
          items: { type: string }
    CreateAnticipationRequest:
      type: object
      additionalProperties: false
      required: [quote]
      properties:
        quote: { type: string }
    PixOptions:
      type: object
      additionalProperties: false
      description: |
        How the Pix charge of a payment with payment_method pix is made. Without due_date,
        an immediate charge, payable for expires_after_seconds (a day unless set). With
        due_date, a charge with a due date, payable until days_after_due days after it,
        with the payer named, and an optional fine and interest for paying late and
        discount for paying early: amount_received is then what the payer paid.
      properties:
        expires_after_seconds: { type: integer, format: int64, minimum: 60, maximum: 1209600 }
        due_date: { type: string, format: date, description: "YYYY-MM-DD, in Brasília." }
        days_after_due: { type: integer, format: int32, minimum: 0, maximum: 365, description: "30 unless set." }
        payer:
          type: object
          additionalProperties: false
          required: [name, tax_id]
          properties:
            name: { type: string, maxLength: 200 }
            tax_id: { type: string, description: "A CPF (11 digits) or a CNPJ (14 characters)." }
        fine:
          type: object
          additionalProperties: false
          description: Charged once, if paid after the due date. An amount or a percent, not both.
          properties:
            amount: { type: integer, format: int64, minimum: 1 }
            percent: { type: string, pattern: '^\d{1,3}\.\d{2}$', description: 'Of the amount, such as "2.00".' }
        interest:
          type: object
          additionalProperties: false
          required: [monthly_percent]
          properties:
            monthly_percent: { type: string, pattern: '^\d{1,3}\.\d{2}$', description: "Of the amount, a month, charged per day late." }
        discount:
          type: object
          additionalProperties: false
          required: [amount, until]
          description: Taken off if paid on or before until.
          properties:
            amount: { type: integer, format: int64, minimum: 1 }
            until: { type: string, format: date }
    RiskDecisionRef:
      type: object
      required: [id, action]
      properties:
        id: { type: string }
        action: { type: string, enum: [allow, review, request_3ds, block] }
    Installments:
      type: object
      description: |
        Parcelado: the payment is authorized once, for the whole amount, and the cardholder
        pays it in count monthly installments. financed_by merchant is parcelado lojista,
        without interest to the cardholder; issuer is parcelado emissor, with interest.
      required: [count, financed_by]
      additionalProperties: false
      properties:
        count: { type: integer, minimum: 2, maximum: 12 }
        financed_by: { type: string, enum: [merchant, issuer] }
    PaymentError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        decline_code: { type: string }
        message: { type: string }
    RiskDecision:
      type: object
      required: [id, object, livemode, payment_intent, attempt, action, rules, features, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [risk_decision] }
        livemode: { type: boolean }
        payment_intent: { type: string }
        attempt: { type: string }
        action: { type: string, enum: [allow, review, request_3ds, block] }
        rules:
          type: array
          description: The rules and list entries that fired; the decision is the most severe of their actions.
          items: { $ref: "#/components/schemas/FiredRule" }
        features:
          type: object
          description: What the rules saw.
          additionalProperties: true
        created: { type: integer, format: int64 }
    FiredRule:
      type: object
      required: [id, action, description]
      properties:
        id: { type: string }
        action: { type: string, enum: [allow, review, request_3ds, block] }
        description: { type: string }
        expression: { type: string }
    RiskDecisionList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RiskDecision" }
    RiskRule:
      type: object
      required: [id, object, action, expression, description, platform]
      properties:
        id: { type: string }
        object: { type: string, enum: [risk_rule] }
        action: { type: string, enum: [allow, review, request_3ds, block] }
        expression: { type: string }
        description: { type: string }
        platform: { type: boolean, description: "A platform rule, which applies to every merchant and cannot be deleted." }
        created: { type: integer, format: int64, nullable: true }
    RiskRulePage:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/RiskRule" }
    CreateRiskRuleRequest:
      type: object
      required: [action, expression]
      additionalProperties: false
      properties:
        action: { type: string, enum: [allow, review, request_3ds, block] }
        expression: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 500 }
    RiskListItem:
      type: object
      required: [id, object, list, kind, value, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [risk_list_item] }
        list: { type: string, enum: [allow, block] }
        kind: { type: string, enum: [card_fingerprint, ip, bin] }
        value: { type: string }
        created: { type: integer, format: int64 }
    RiskListItemPage:
      type: object
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/RiskListItem" }
    CreateRiskListItemRequest:
      type: object
      required: [list, kind, value]
      additionalProperties: false
      properties:
        list: { type: string, enum: [allow, block] }
        kind: { type: string, enum: [card_fingerprint, ip, bin] }
        value: { type: string, maxLength: 100 }
    NextAction:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            redirect_to_url: send the customer to redirect_to_url.url to complete 3-D Secure.
            use_test_authentication: in test mode, complete it with the test helper.
            pix_display_qr_code: show the customer pix_display_qr_code.data, as a QR code and as text to copy and paste.
            awaiting_payer_authorization: the customer's bank is showing them a subscription to accept.
            boleto_display_details: show the customer the boleto in boleto_display_details.
        redirect_to_url:
          type: object
          required: [url]
          properties:
            url: { type: string }
        pix_display_qr_code:
          type: object
          required: [data, expires_at]
          properties:
            data: { type: string, description: "The BR Code (Pix Copia e Cola)." }
            expires_at: { type: integer, format: int64, description: "When it can no longer be paid, Unix time." }
        boleto_display_details:
          type: object
          required: [line, barcode, due_date, pix_code]
          properties:
            line: { type: string, description: "The 47-digit typed line (linha digitável)." }
            barcode: { type: string, description: The 44-digit barcode. }
            due_date: { type: string, format: date }
            pix_code:
              type: string
              nullable: true
              description: "A hybrid boleto's Pix QR code (Pix Copia e Cola), once the bank registered it."
    BoletoOptions:
      type: object
      additionalProperties: false
      required: [due_date, payer]
      description: |
        A boleto's terms, for the payment method boleto: its due date, the days after it the
        bank still takes it before writing it off (0 to 60), who pays it, and whether it
        carries a Pix QR code (hybrid, unless pix is false). Boletos are paid in full and
        cannot be refunded through Jupiter.
      properties:
        due_date: { type: string, format: date }
        days_after_due: { type: integer, minimum: 0, maximum: 60 }
        payer:
          type: object
          additionalProperties: false
          required: [name, tax_id]
          properties:
            name: { type: string, maxLength: 40 }
            tax_id: { type: string }
        pix: { type: boolean }
    PaymentIntentList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PaymentIntent" }
    CreatePaymentIntentRequest:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
        capture_method: { type: string, enum: [automatic, manual] }
        payment_method: { type: string, description: "A saved payment method (pm_...), a test one, pix or boleto." }
        description: { type: string, maxLength: 1000 }
        confirm: { type: boolean }
        installments: { $ref: "#/components/schemas/Installments" }
        setup_future_usage:
          type: string
          enum: [off_session]
          description: Store the card, with this customer-initiated payment, for later off_session ones.
        off_session:
          type: boolean
          description: With confirm, a merchant-initiated payment, made without the cardholder on a card stored before.
        request_three_d_secure:
          type: string
          enum: [automatic, any]
          description: automatic lets the risk engine decide when to authenticate the cardholder; any always does.
        customer_ip: { type: string, maxLength: 45, description: "The customer's IP address, for the risk engine." }
        return_url: { type: string, maxLength: 2048, description: "Where to send the customer after a 3-D Secure challenge: an absolute https URL." }
        pix: { $ref: "#/components/schemas/PixOptions" }
        boleto: { $ref: "#/components/schemas/BoletoOptions" }
        split:
          type: array
          maxItems: 20
          description: Divides a card payment among recipients. Without it, the payment is all the merchant's.
          items: { $ref: "#/components/schemas/SplitRule" }
    UpdatePaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        payment_method: { type: string, description: "A saved payment method (pm_...), a test one, pix or boleto." }
        description: { type: string, maxLength: 1000 }
        installments: { $ref: "#/components/schemas/Installments" }
        setup_future_usage: { type: string, enum: [off_session] }
        request_three_d_secure: { type: string, enum: [automatic, any] }
        pix: { $ref: "#/components/schemas/PixOptions" }
        boleto: { $ref: "#/components/schemas/BoletoOptions" }
        split:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SplitRule" }
    ConfirmPaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        payment_method: { type: string, description: "A saved payment method (pm_...), a test one, pix or boleto." }
        off_session: { type: boolean }
        customer_ip: { type: string, maxLength: 45 }
        return_url: { type: string, maxLength: 2048, description: "Where to send the customer after a 3-D Secure challenge: an absolute https URL." }
    CapturePaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        amount_to_capture: { type: integer, format: int64, minimum: 1 }
    CancelPaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        cancellation_reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer, abandoned] }
    CompleteActionRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [succeeded, failed] }

    Refund:
      type: object
      required: [id, object, livemode, amount, currency, payment_intent, reason, status, failure_reason, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [refund] }
        livemode: { type: boolean }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        payment_intent: { type: string }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [pending, succeeded, failed] }
        failure_reason: { type: string, nullable: true }
        created: { type: integer, format: int64 }
    RefundList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Refund" }
    Payout:
      type: object
      required: [id, object, livemode, amount, currency, destination, description, status, failure_code, failure_message,
                 end_to_end_id, arrival_date, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [payout] }
        livemode: { type: boolean }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        destination: { $ref: "#/components/schemas/PayoutDestination" }
        description: { type: string }
        status:
          type: string
          enum: [pending, held, paid, failed, returned]
          description: "held waits for Jupiter to release it; returned was paid, and sent back by the receiving bank: its amount is the balance's again."
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        end_to_end_id: { type: string, nullable: true, description: "The Pix's endToEndId, once paid." }
        arrival_date: { type: integer, format: int64, nullable: true, description: "When it was paid, Unix time." }
        recipient: { type: string, nullable: true, description: "The recipient whose balance paid it; null for the merchant's." }
        returned_at: { type: integer, format: int64, nullable: true }
        scheduled_on: { type: string, format: date, nullable: true, description: "The day the recipient's transfer settings made it." }
        created: { type: integer, format: int64 }
    PayoutDestination:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pix, bank_account] }
        pix_key: { type: string, description: "A CPF, a CNPJ, an e-mail, a phone number (+5511...) or a random key." }
        ispb: { type: string }
        branch: { type: string }
        account: { type: string }
        recipient_name: { type: string, nullable: true, description: "Who the key belongs to, as DICT names them, once paid." }
    PayoutList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Payout" }
    CreatePayoutRequest:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [brl] }
        recipient:
          type: string
          description: Pays out this recipient's available balance instead of the merchant's.
        destination:
          type: object
          description: |
            Optional. A balance is paid out only to its own payout_destination: a recipient's, or for
            the merchant's balance, its own recipient's (me). A key given must be that one.
          required: [type, pix_key]
          additionalProperties: false
          properties:
            type: { type: string, enum: [pix] }
            pix_key: { type: string, maxLength: 77 }
        description: { type: string, maxLength: 140 }
    Subscription:
      type: object
      required: [id, object, livemode, status, amount, currency, interval, start_date, end_date, description, customer,
                 retries, authorization, next_action, canceled_by, cycles, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [subscription] }
        livemode: { type: boolean }
        status:
          type: string
          enum: [incomplete, active, past_due, rejected, canceled, ended]
          description: |
            incomplete: waiting for the customer's authorization. active: charging. past_due: the
            latest cycle's charge failed. rejected: the customer refused it. canceled: by you or
            the customer (canceled_by). ended: past its end_date.
        amount: { type: integer, format: int64 }
        currency: { type: string }
        interval: { type: string, enum: [week, month, quarter, half_year, year] }
        start_date: { type: string, format: date, description: The first cycle's due date. }
        end_date: { type: string, format: date, nullable: true }
        description: { type: string }
        customer: { $ref: "#/components/schemas/SubscriptionCustomer" }
        retries: { type: string, enum: [none, three_in_seven] }
        authorization: { $ref: "#/components/schemas/SubscriptionAuthorization" }
        next_action:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NextAction" }]
        canceled_by: { type: string, enum: [merchant, customer], nullable: true }
        cycles:
          type: array
          items: { $ref: "#/components/schemas/SubscriptionCycle" }
        created: { type: integer, format: int64 }
    SubscriptionCustomer:
      type: object
      additionalProperties: false
      required: [name, tax_id]
      properties:
        name: { type: string, maxLength: 140 }
        tax_id: { type: string, description: "A CPF (11 digits) or a CNPJ (14 characters)." }
    SubscriptionAuthorization:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [qr_code, payer_request] }
        payer_bank:
          type: object
          additionalProperties: false
          required: [ispb, account]
          description: The customer's account, where payer_request sends the request.
          properties:
            ispb: { type: string, pattern: '^[0-9A-Z]{8}$' }
            branch: { type: string, pattern: '^[0-9]{1,4}$' }
            account: { type: string, pattern: '^[0-9]{1,20}$' }
    SubscriptionCycle:
      type: object
      required: [number, due_date, payment_intent, status]
      properties:
        number: { type: integer }
        due_date: { type: string, format: date }
        payment_intent: { type: string, nullable: true }
        status: { type: string, enum: [pending, paid, failed, canceled] }
    SubscriptionList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Subscription" }
    ReceivableUnit:
      type: object
      required: [id, object, arrangement, settlement_date, currency, amount, blocked, committed, free, settled_amount, settled_on, registered]
      properties:
        id: { type: string }
        object: { type: string, enum: [receivable_unit] }
        arrangement:
          type: string
          description: The payment arrangement's code (VCC for Visa credit, MCC for Mastercard credit, and so on).
        settlement_date: { type: string, format: date }
        currency: { type: string }
        amount: { type: integer, format: int64, description: "What the unit will settle for, net of fees and refunds." }
        blocked: { type: integer, format: int64 }
        committed:
          type: array
          items: { $ref: "#/components/schemas/ReceivableCommitment" }
        free: { type: integer, format: int64, description: What no contract or block holds. }
        settled_amount: { type: integer, format: int64, nullable: true }
        settled_on: { type: string, format: date, nullable: true }
        registered: { type: boolean, description: Whether the registry has the unit. }
    ReceivableCommitment:
      type: object
      required: [contract, beneficiary, effect, amount]
      properties:
        contract: { type: string }
        beneficiary: { type: string, description: The financier's CNPJ. }
        effect: { type: string, enum: [ownership_transfer, lien] }
        amount: { type: integer, format: int64 }
    ReceivablesAgenda:
      type: object
      required: [object, as_of, data]
      properties:
        object: { type: string, enum: [receivables_agenda] }
        as_of: { type: integer, format: int64 }
        data:
          type: array
          items: { $ref: "#/components/schemas/ReceivableUnit" }
    ReceivablesOptIn:
      type: object
      required: [object, financier, active, synced, updated]
      properties:
        object: { type: string, enum: [receivables_opt_in] }
        financier: { type: string }
        active: { type: boolean }
        synced: { type: boolean, description: Whether the registry has been told. }
        updated: { type: integer, format: int64 }
    ReceivablesOptInList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/ReceivablesOptIn" }
    CreateReceivablesOptInRequest:
      type: object
      additionalProperties: false
      required: [financier]
      properties:
        financier: { type: string, description: The financier's CNPJ. }
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, interval, start_date, description, customer, authorization]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [brl] }
        interval: { type: string, enum: [week, month, quarter, half_year, year] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        description: { type: string, maxLength: 35, description: "What the customer's bank shows them they are paying for." }
        customer: { $ref: "#/components/schemas/SubscriptionCustomer" }
        retries: { type: string, enum: [none, three_in_seven], description: "three_in_seven unless set." }
        authorization: { $ref: "#/components/schemas/SubscriptionAuthorization" }
    CreateRefundRequest:
      type: object
      required: [payment_intent]
      additionalProperties: false
      properties:
        payment_intent: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer] }

    ApiKey:
      type: object
      required: [id, object, livemode, kind, name, last4, scopes, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [api_key] }
        livemode: { type: boolean }
        kind: { type: string, enum: [secret, publishable, restricted] }
        name: { type: string }
        last4: { type: string }
        scopes:
          type: array
          items: { type: string }
        created: { type: integer, format: int64 }
        revoked: { type: integer, format: int64, nullable: true }
        value:
          type: string
          description: The key itself, present only in the response that created it.
    ApiKeyList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ApiKey" }
    CreateApiKeyRequest:
      type: object
      required: [scopes]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }

    Dispute:
      type: object
      required: [id, object, livemode, payment_intent, kind, network, reason, reason_code, amount, currency, stage, status, liability, evidence, funds, history, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [dispute] }
        livemode: { type: boolean }
        payment_intent: { type: string }
        kind: { type: string, enum: [chargeback, med], description: "A card network's chargeback, or a MED claim on a Pix." }
        network: { type: string, description: "The card scheme, or pix." }
        reason: { type: string }
        reason_code: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        stage: { type: string, enum: [chargeback, pre_arbitration, arbitration, med_analysis, med_contestation] }
        status: { type: string, enum: [needs_response, under_review, won, lost] }
        liability:
          type: string
          enum: [merchant, scheme]
          description: scheme when the dispute came after the participants' liability ended, 180 days from authorization.
        evidence: { $ref: "#/components/schemas/DisputeEvidence" }
        evidence_submitted: { type: integer, format: int64 }
        due_by: { type: integer, format: int64, description: "When the merchant's response is due." }
        funds:
          type: string
          enum: [none, held, withdrawn, reinstated, released]
          description: What the dispute did to the money.
        held: { type: integer, format: int64, description: "What a MED claim held of the merchant's balance." }
        trace:
          type: array
          description: Where the part of a MED claim that could not be held went.
          items: { $ref: "#/components/schemas/DisputeTraceHop" }
        outcome: { type: string }
        history:
          type: array
          items: { $ref: "#/components/schemas/DisputeChange" }
        created: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
    DisputeEvidence:
      type: object
      additionalProperties: false
      properties:
        product_description: { type: string, maxLength: 5000 }
        customer_name: { type: string, maxLength: 5000 }
        customer_email: { type: string, maxLength: 5000 }
        customer_communication: { type: string, maxLength: 5000 }
        shipping_tracking_number: { type: string, maxLength: 5000 }
        refund_policy: { type: string, maxLength: 5000 }
        uncategorized_text: { type: string, maxLength: 5000 }
    DisputeTraceHop:
      type: object
      required: [payout, end_to_end_id, amount]
      properties:
        payout: { type: string }
        end_to_end_id: { type: string }
        amount: { type: integer, format: int64 }
    DisputeChange:
      type: object
      required: [at, kind, detail]
      properties:
        at: { type: integer, format: int64 }
        kind: { type: string }
        detail: { type: string }
    DisputeList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Dispute" }
    UpdateDisputeRequest:
      type: object
      additionalProperties: false
      properties:
        evidence: { $ref: "#/components/schemas/DisputeEvidence" }
        submit: { type: boolean }
    CreateTestDisputeRequest:
      type: object
      required: [payment_intent, reason_code]
      additionalProperties: false
      properties:
        payment_intent: { type: string }
        reason_code: { type: string, maxLength: 8, description: "A Visa (10.4, 13.1, ...) or Mastercard (4837, 4855, ...) reason code." }
        amount: { type: integer, format: int64, minimum: 1, description: "All that is left of the payment when omitted." }
    FraudReport:
      type: object
      required: [id, object, livemode, payment_intent, network, fraud_type, amount, currency, reported]
      properties:
        id: { type: string }
        object: { type: string, enum: [fraud_report] }
        livemode: { type: boolean }
        payment_intent: { type: string }
        network: { type: string }
        fraud_type: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        reported: { type: integer, format: int64 }
    FraudReportList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/FraudReport" }
    CreateTestFraudReportRequest:
      type: object
      required: [payment_intent, fraud_type]
      additionalProperties: false
      properties:
        payment_intent: { type: string }
        fraud_type:
          type: string
          enum: [card_never_received, fraudulent_application, counterfeit, account_takeover, card_not_present, lost, stolen, other]
    DisputeMonitoring:
      type: object
      required: [object, livemode, month, transactions, disputes, fraud_reports, ratio_bps, threshold_bps, minimum_count, excessive]
      properties:
        object: { type: string, enum: [dispute_monitoring] }
        livemode: { type: boolean }
        month: { type: string }
        transactions: { type: integer, format: int64, description: "Card payments captured, by when they were authorized." }
        disputes: { type: integer, format: int64 }
        fraud_reports: { type: integer, format: int64 }
        ratio_bps: { type: integer, format: int64 }
        threshold_bps: { type: integer, format: int64 }
        minimum_count: { type: integer, format: int64 }
        excessive: { type: boolean }
    ReconciliationReport:
      type: object
      required: [object, livemode, date, streams, breaks]
      properties:
        object: { type: string, enum: [reconciliation_report] }
        livemode: { type: boolean }
        date: { type: string, format: date }
        streams:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationStream" }
        breaks:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationBreak" }
    ReconciliationStream:
      type: object
      required: [counterparty, stream, matched, matched_amount, open, opened, resolved, ageing]
      properties:
        counterparty: { type: string, description: "card_network, slc, bank, pix_bank or registry." }
        stream: { type: string, description: "clearing, grade, cnab_return, statement or positions." }
        matched: { type: integer, format: int64, description: "Your movements of the day that matched." }
        matched_amount: { type: integer, format: int64 }
        open: { type: integer, description: "Breaks open at the day's end." }
        opened: { type: integer, description: "Breaks opened by the day's reconciliation." }
        resolved: { type: integer, description: "Breaks resolved by it." }
        ageing:
          type: object
          required: [up_to_1_day, up_to_7_days, up_to_30_days, older]
          properties:
            up_to_1_day: { type: integer }
            up_to_7_days: { type: integer }
            up_to_30_days: { type: integer }
            older: { type: integer }
    ReconciliationBreak:
      type: object
      required: [id, object, livemode, counterparty, stream, kind, amount, status, opened_on, age_days, reasons]
      properties:
        id: { type: string }
        object: { type: string, enum: [reconciliation_break] }
        livemode: { type: boolean }
        counterparty: { type: string }
        stream: { type: string }
        kind:
          type: string
          enum: [missing_at_counterparty, missing_at_jupiter, duplicate, amount_mismatch, probable_match, divergence]
        key: { type: string, description: "What the movement is known by: an RRN, a nosso número, an end-to-end id, a transfer, a day." }
        amount: { type: integer, format: int64 }
        value_date: { type: string, format: date }
        detail: { type: string }
        score: { type: integer, description: "How alike the two sides' records are, out of 100." }
        reasons:
          type: array
          items: { type: string }
        status: { type: string, enum: [open, resolved] }
        resolution:
          type: string
          enum: [matched, superseded, fixed_at_counterparty, confirmed, resolved_by_operator]
          description: How a resolved break ended.
        opened_on: { type: string, format: date }
        resolved_on: { type: string, format: date }
        age_days: { type: integer }
    ReconciliationBreakList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ReconciliationBreak" }
    WebhookEndpoint:
      type: object
      required: [id, object, livemode, url, description, enabled_events, status, api_version, created]
      properties:
        id: { type: string }
        object: { type: string, enum: [webhook_endpoint] }
        livemode: { type: boolean }
        url: { type: string }
        description: { type: string }
        enabled_events:
          type: array
          items: { type: string }
        status: { type: string, enum: [enabled, disabled] }
        api_version: { type: string }
        created: { type: integer, format: int64 }
        secret:
          type: string
          description: The signing secret, present only when it was just created or rolled.
    WebhookEndpointList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WebhookEndpoint" }
    CreateWebhookEndpointRequest:
      type: object
      required: [url, enabled_events]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        enabled_events:
          type: array
          minItems: 1
          items: { type: string }
    UpdateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        enabled_events:
          type: array
          minItems: 1
          items: { type: string }
        status: { type: string, enum: [enabled, disabled] }
    RollSecretRequest:
      type: object
      additionalProperties: false
      properties:
        expire_current_in: { type: integer, minimum: 0, maximum: 604800 }

    DeletedObject:
      type: object
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string }
        deleted: { type: boolean, enum: [true] }

    Event:
      type: object
      required: [id, object, type, livemode, created, related_object]
      properties:
        id: { type: string }
        object: { type: string, enum: [event] }
        type: { type: string }
        livemode: { type: boolean }
        created: { type: integer, format: int64 }
        related_object: { $ref: "#/components/schemas/RelatedObject" }
    RelatedObject:
      type: object
      required: [id, type, url]
      description: |
        What the event is about. Events are thin: fetch the object for its current state,
        or ask for it inline with include[]=related_object.
      properties:
        id: { type: string }
        type: { type: string }
        url: { type: string }
        object:
          description: The object's current state, when included and it still exists.
          type: object
          additionalProperties: true
    EventList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Event" }
    ResendEventRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_endpoint: { type: string }
