# Host ports use a 5xxxx range so Jupiter runs beside stacks that use the defaults.

name: jupiter

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 3s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:18.6-alpine # keep in step with postgrestest.Image
    environment:
      POSTGRES_DB: jupiter
      POSTGRES_USER: jupiter
      POSTGRES_PASSWORD: ${JUPITER_POSTGRES_PASSWORD:-jupiter} # local development only
    ports:
      - "127.0.0.1:${JUPITER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready --username=jupiter --dbname=jupiter"]

  otel-collector:
    build: deploy/otel-collector
    image: jupiter/otel-collector:0.161.0
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${JUPITER_OTLP_GRPC_PORT:-54317}:4317"
      - "127.0.0.1:${JUPITER_OTLP_HTTP_PORT:-54318}:4318"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/busybox", "wget", "-qO-", "http://127.0.0.1:13133/"]

  jaeger:
    # Held at 2.20: 2.21 removed the v1 HTTP query endpoints (jaegertracing/jaeger#9260)
    # that Grafana's Jaeger data source still calls.
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:${JUPITER_JAEGER_UI_PORT:-56686}:16686"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]

  prometheus:
    image: prom/prometheus:v3.15.0-busybox
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${JUPITER_PROMETHEUS_PORT:-59090}:9090"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Anonymous admin with no login form: acceptable only because the port is bound
      # to 127.0.0.1 and the stack holds no real data.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${JUPITER_GRAFANA_PORT:-53000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
